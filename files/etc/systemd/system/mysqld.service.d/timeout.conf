[Service]
# Disable the startup timeout because MySQL 8.0+ performs an automatic in-place
# upgrade of the data dictionary and system tables on first start after a version
# bump. This upgrade runs inside the server process itself (mysql_upgrade was
# removed in 8.4) and can take several minutes depending on the version gap and
# data volume. Unlike MariaDB, MySQL does not implement EXTEND_TIMEOUT_USEC via
# sd_notify, so systemd has no way to learn that the server is still making
# progress. Without this override, systemd would SIGTERM mysqld when
# TimeoutStartSec expires and eventually follow up with SIGKILL, risking InnoDB
# data corruption mid-upgrade.
TimeoutStartSec=0
